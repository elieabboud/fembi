version: '3.8'

services:
  # PostgreSQL Database for Auditing
  postgres:
    image: postgres:15-alpine
    container_name: multi-api-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pokemon_audit
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d pokemon_audit"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: multi-api-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"     # AMQP port
      - "15672:15672"   # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: pokemon_user
      RABBITMQ_DEFAULT_PASS: pokemon_pass
      RABBITMQ_DEFAULT_VHOST: pokemon_vhost
      RABBITMQ_ERLANG_COOKIE: "multi-api-secret-cookie"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - api-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # Multi-Source API Wrapper Service (starts first)
  wrapper-api:
    build:
      context: .
      dockerfile: PokeApi.Wrapper/Dockerfile
    container_name: multi-api-wrapper
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ASPNETCORE_LOGGING__LOGLEVEL__DEFAULT=Information
      - ExternalApis__PokeApi__BaseUrl=https://pokeapi.co/api/v2/
      - ExternalApis__PokeApi__TimeoutSeconds=30
      - ExternalApis__PokeApi__CacheExpirationMinutes=10
      - ExternalApis__DummyJson__BaseUrl=https://dummyjson.com/
      - ExternalApis__DummyJson__TimeoutSeconds=30
      - ExternalApis__DummyJson__CacheExpirationMinutes=10
      - RateLimit__RequestsPerMinute=100
      - RateLimit__RequestsPerHour=1000
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=pokemon_user
      - RabbitMQ__Password=pokemon_pass
      - RabbitMQ__VirtualHost=pokemon_vhost
      - RabbitMQ__ConnectionTimeoutSeconds=30
      - RabbitMQ__RequestTimeoutSeconds=30
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - api-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Auditing Service (starts after wrapper API)
  audit-service:
    build:
      context: .
      dockerfile: PokeApi.Audit/Dockerfile
    container_name: multi-api-audit
    ports:
      - "5002:5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5002
      - ASPNETCORE_LOGGING__LOGLEVEL__DEFAULT=Information
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=pokemon_audit;Username=audit_user;Password=audit_pass;Port=5432
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=pokemon_user
      - RabbitMQ__Password=pokemon_pass
      - RabbitMQ__VirtualHost=pokemon_vhost
      - RabbitMQ__ConnectionTimeoutSeconds=30
      - RabbitMQ__RequestTimeoutSeconds=30
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      wrapper-api:
        condition: service_healthy
    networks:
      - api-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # Multi-Source Internal API Service (starts last)
  internal-api:
    build:
      context: .
      dockerfile: PokeApi.Internal/Dockerfile
    container_name: multi-api-internal
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_LOGGING__LOGLEVEL__DEFAULT=Information
      - UseMessaging=true
      - WrapperApi__BaseUrl=http://wrapper-api:5001
      - WrapperApi__TimeoutSeconds=30
      - WrapperApi__RetryAttempts=3
      - RateLimit__RequestsPerMinute=200
      - RateLimit__RequestsPerHour=2000
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=pokemon_user
      - RabbitMQ__Password=pokemon_pass
      - RabbitMQ__VirtualHost=pokemon_vhost
      - RabbitMQ__ConnectionTimeoutSeconds=30
      - RabbitMQ__RequestTimeoutSeconds=30
    depends_on:
      rabbitmq:
        condition: service_healthy
      wrapper-api:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    networks:
      - api-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped

networks:
  api-network:
    driver: bridge
    name: multi-api-network

volumes:
  rabbitmq_data:
    driver: local
  postgres_data:
    driver: local