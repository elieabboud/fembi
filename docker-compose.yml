services:
  # Pokemon API Wrapper Service
  wrapper-api:
    build:
      context: .
      dockerfile: PokeApi.Wrapper/Dockerfile
    container_name: pokemon-wrapper-api
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
    networks:
      - pokemon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Pokemon Internal API Service
  internal-api:
    build:
      context: .
      dockerfile: PokeApi.Internal/Dockerfile
    container_name: pokemon-internal-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - WrapperApi__BaseUrl=http://wrapper-api:5001
    depends_on:
      wrapper-api:
        condition: service_healthy
    networks:
      - pokemon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  pokemon-network:
    driver: bridge
    name: pokemon-api-network
