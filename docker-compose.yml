services:
  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pokemon-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"     # AMQP port
      - "15672:15672"   # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: pokemon_user
      RABBITMQ_DEFAULT_PASS: pokemon_pass
      RABBITMQ_DEFAULT_VHOST: pokemon_vhost
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - pokemon-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Pokemon API Wrapper Service
  wrapper-api:
    build:
      context: .
      dockerfile: PokeApi.Wrapper/Dockerfile
    container_name: pokemon-wrapper-api
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ASPNETCORE_LOGGING__LOGLEVEL__DEFAULT=Information
      - ExternalApis__PokeApi__BaseUrl=https://pokeapi.co/api/v2/
      - ExternalApis__PokeApi__TimeoutSeconds=30
      - ExternalApis__PokeApi__CacheExpirationMinutes=10
      - RateLimit__RequestsPerMinute=100
      - RateLimit__RequestsPerHour=1000
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=pokemon_user
      - RabbitMQ__Password=pokemon_pass
      - RabbitMQ__VirtualHost=pokemon_vhost
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pokemon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Pokemon Internal API Service
  internal-api:
    build:
      context: .
      dockerfile: PokeApi.Internal/Dockerfile
    container_name: pokemon-internal-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_LOGGING__LOGLEVEL__DEFAULT=Information
      - WrapperApi__BaseUrl=http://wrapper-api:5001
      - WrapperApi__TimeoutSeconds=30
      - WrapperApi__RetryAttempts=3
      - RateLimit__RequestsPerMinute=200
      - RateLimit__RequestsPerHour=2000
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=pokemon_user
      - RabbitMQ__Password=pokemon_pass
      - RabbitMQ__VirtualHost=pokemon_vhost
    depends_on:
      rabbitmq:
        condition: service_healthy
      wrapper-api:
        condition: service_healthy
    networks:
      - pokemon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

networks:
  pokemon-network:
    driver: bridge
    name: pokemon-api-network

volumes:
  rabbitmq_data:
    driver: local