services:
  fbc-frontend:
    env_file:
      - .env
    restart: unless-stopped
    image: ${IMAGE_NAME}:${VERSION}
    ports:
      - "${EXPOSED_DOCKER_PORT}:80"
    container_name: fbc-frontend-${ENVIRONMENT}
    networks:
      - booking-network
    volumes:
      - .env:/usr/share/nginx/html/.env
networks:
  booking-network:
    external: true
