services:
  - docker:dind

before_script:
  - ssh -F ~/.ssh/config target 
  - echo "$(whoami) on $(hostname)"; uname -a
  - echo "$JFROG_PASSWORD" | docker login -u "$JFROG_USERNAME" --password-stdin $JFROG_REGISTRY

build_image:
  stage: build
  tags: [fembi, frontend, dev]
  image: docker:24.0
  script:
    - docker build -t $JFROG_REGISTRY/$JFROG_REPO/$IMAGE_NAME:$CI_COMMIT_SHA .
  artifacts:
    paths:
      - docker-image.tar
    expire_in: 1h

push_image:
  stage: push
  tags: [fembi, frontend, dev]
  image: docker:24.0
  script:
    - docker push $JFROG_REGISTRY/$JFROG_REPO/$IMAGE_NAME:$CI_COMMIT_SHA


